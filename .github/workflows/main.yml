name: Build iOS App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'

      - name: Build Archive
        run: |
          # 自动定位 TestApp.xcodeproj 的位置并编译
          PROJECT_PATH=$(find . -name "TestApp.xcodeproj" | head -n 1)
          SCHEME_NAME="TestApp"
          
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath ./build/TestApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA Folder
        run: |
          mkdir -p Payload
          # 拷贝编译好的 .app 文件
          cp -r ./build/TestApp.xcarchive/Products/Applications/*.app ./Payload/
          zip -r TestApp.ipa Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyLocalReader-Unsigned
          path: TestApp.ipa
